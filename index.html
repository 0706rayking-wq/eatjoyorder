}
function roundRect(x,y,w,h,r){
  X.beginPath();X.moveTo(x+r,y);X.lineTo(x+w-r,y);X.arcTo(x+w,y,x+w,y+r,r);X.lineTo(x+w,y+h-r);X.arcTo(x+w,y+h,x+w-r,y+h,r);X.lineTo(x+r,y+h);X.arcTo(x,y+h,x,y+h-r,r);X.lineTo(x,y+r);X.arcTo(x,y,x+r,y,r);X.closePath();

function rollEnv(){

  document.getElementById('wtag').textContent=(currentWeather.icon||'')+(currentWeather.name||'')+'·'+(currentArena.name||'');
}
function generateMap(){
  WALLS=[];
  var th=55;
  WALLS.push({x:0,y:0,w:MAP.w,h:th},{x:0,y:MAP.h-th,w:MAP.w,h:th},{x:0,y:0,w:th,h:MAP.h},{x:MAP.w-th,y:0,w:th,h:MAP.h});
  var ps=[[400,300,55,180],[800,200,180,55],[600,580,55,160],[1200,400,160,55],[900,800,55,180],[1400,200,55,260],[300,900,180,55],[1100,1000,55,180],[700,1200,180,55],[1500,800,160,55],[400,1300,55,160],[1000,1400,180,55]];
  for(var i=0;i<ps.length;i++){var p=ps[i];WALLS.push({x:p[0],y:p[1],w:p[2],h:p[3]});}
}
function checkWall(nx,ny,r){for(var i=0;i<WALLS.length;i++){var w=WALLS[i];if(nx>w.x-r&&nx<w.x+w.w+r&&ny>w.y-r&&ny<w.y+w.h+r)return true;}return false;}
function spawnTraps(){
  TRAPS=[];
  var n=Math.min(2+Math.floor(floorN/2),5);
  var spots=[[500,500],[1000,400],[800,900],[1400,700],[600,1200]];
  for(var i=0;i<n;i++){var tp=Math.random()<0.5?'saw':'flame';TRAPS.push({type:tp,x:spots[i][0],y:spots[i][1],r:32,ang:0,timer:Math.floor(Math.random()*80)});}
}
function spawnCracks(){
  CRACKS=[];
  var spots=[[200,200],[1800,200],[200,1400],[1800,1400]];
  var n=Math.min(1+Math.floor(floorN/3),spots.length);
  for(var i=0;i<n;i++)CRACKS.push({x:spots[i][0],y:spots[i][1],r:22,pulse:0,explored:false});
}
function tipOf(ox,oy,sw){
  var t=sw.orbitType||'circle',a=sw.a,r=sw.rad;
  if(t==='ellipse')return{x:ox+Math.cos(a)*r,y:oy+Math.sin(a)*(r*0.42)};
  if(t==='inf'){var s2=Math.sin(a),d2=1+s2*s2;return{x:ox+Math.cos(a)*r/d2,y:oy+Math.sin(a)*Math.cos(a)*r/d2};}
  if(t==='square'){var nr=r/Math.max(Math.abs(Math.cos(a)),Math.abs(Math.sin(a)));return{x:ox+Math.cos(a)*nr,y:oy+Math.sin(a)*nr};}
  return{x:ox+Math.cos(a)*r,y:oy+Math.sin(a)*r};
}

    sp2:{x:rx-bw*2-sc(4),y:bot-bh*2-sc(5),w:bw,h:bh,col:'#a29bfe'},
    skA:{x:rx-bw*4-sc(13),y:bot-bh,w:bw,h:bh,col:''},
    skB:{x:rx-bw*3-sc(8),y:bot-bh,w:bw,h:bh,col:''},
    shr:{x:rx-bw*2-sc(4),y:bot-bh,w:bw,h:bh,col:'#00b894'},
    dsh:{x:rx-bw,y:bot-bh,w:bw,h:bh,col:'#6c5ce7'},

}

function castSpell(idx){
  if(showModal||selStage!==3||!P)return;
  var spn=P.spells[idx];if(!spn)return;
  var def=null;for(var i=0;i<SPELLS.length;i++){if(SPELLS[i].n===spn){def=SPELLS[i];break;}}if(!def)return;
  var boost=(P.classId==='weaver'?1.5:1)*(P.chinese.id==='dragon'?1.3:1)*(currentWeather&&currentWeather.id==='aurora'?1.3:1);
  if(P.st<def.cost){toast('氣力不足！');return;}P.st-=def.cost;
  var ang=isMobile?(aimT.moved?aimT.ang:P.sw.a):Math.atan2(mouse.y+MAP.camY-P.y,mouse.x+MAP.camX-P.x);
  var nx=Math.cos(ang),ny=Math.sin(ang);
  var wx2=(wfx.wind&&wfx.wind.x)||0,wy2=(wfx.wind&&wfx.wind.y)||0;
  if(spn==='火球')PROJ.push({x:P.x,y:P.y,vx:nx*7.5+wx2*0.4,vy:ny*7.5+wy2*0.4,r:11,col:'#e17055',dmg:44*boost,life:200,type:'fire',trail:[]});
  else if(spn==='手裡劍'){for(var i=0;i<8;i++){var a=i/8*Math.PI*2;PROJ.push({x:P.x,y:P.y,vx:Math.cos(a)*5.5+wx2*0.2,vy:Math.sin(a)*5.5+wy2*0.2,r:6,col:'#b2bec3',dmg:22*boost,life:160,type:'shuriken',spin:0});}}
  else if(spn==='雷電'){var sorted=ENE.slice().sort(function(a,b){return dist(P.x,P.y,a.x,a.y)-dist(P.x,P.y,b.x,b.y);});for(var i=0;i<Math.min(4,sorted.length);i++){(function(e,d){setTimeout(function(){e.hp-=46*boost;e.fl=10;addP(e.x,e.y,'#fdcb6e',10,3);SPW.push({type:'ltng',x1:P.x,y1:P.y,x2:e.x,y2:e.y,l:14});},d);})(sorted[i],i*100);}}
  else if(spn==='盾牌'){P.shield=1;P.shieldT=290;}
  else if(spn==='冰凍'){for(var i=0;i<ENE.length;i++){if(dist(P.x,P.y,ENE[i].x,ENE[i].y)<260)ENE[i].frz=220;}}
  toast(spn+'！');P.spells[idx]=null;

}

function getMoveDir(){
  if(isMobile){if(joy.on&&(joy.dx||joy.dy))return{x:joy.dx,y:joy.dy};return{x:0,y:0};}
  var mx=0,my=0;
  if(keys['ArrowLeft']||keys['a']||keys['A'])mx-=1;if(keys['ArrowRight']||keys['d']||keys['D'])mx+=1;
  if(keys['ArrowUp']||keys['w']||keys['W'])my-=1;if(keys['ArrowDown']||keys['s']||keys['S'])my+=1;
  if(mx||my){var m=Math.sqrt(mx*mx+my*my);return{x:mx/m,y:my/m};}return{x:0,y:0};
}

document.addEventListener('keydown',function(e){

  if(e.key==='1')castSpell(0);if(e.key==='2')castSpell(1);if(e.key==='3')castSpell(2);
  if(e.key==='q'||e.key==='Q')doSkillA();if(e.key==='e'||e.key==='E')doSkillB();
  if(e.key==='r'||e.key==='R'){selStage=0;selClass=null;selZodiac=null;selChinese=null;dead=false;}
});

function handleSelClick(x,y){
  var list=selStage===0?CLASSES:(selStage===1?ZODIACS:CHINESE);
  var cols=2,bw=(W-sc(24))/cols,bh=sc(70),gap=sc(6);
  var sx=sc(10),sy=sc(44);
  for(var i=0;i<list.length;i++){
    var col=i%cols,row=Math.floor(i/cols);
    var bx=sx+col*(bw+gap),by=sy+row*(bh+gap);
    if(x>=bx&&x<=bx+bw&&y>=by&&y<=by+bh){
      if(selStage===0){selClass=list[i];selStage=1;}
      else if(selStage===1){selZodiac=list[i];selStage=2;}
      else{selChinese=list[i];startGame();}
      return;
    }
  }
}
canvasEl.addEventListener('click',function(e){
  var r2=canvasEl.getBoundingClientRect();var cx=e.clientX-r2.left,cy=e.clientY-r2.top;
  if(selStage<3){handleSelClick(cx,cy);return;}
  if(dead){selStage=0;selClass=null;selZodiac=null;selChinese=null;dead=false;return;}
  if(showModal){
    var mw=W*0.82,mh=sc(170),mx2=(W-mw)/2,my2=(H-mh)/2;
    var yb={x:mx2+sc(18),y:my2+sc(108),w:mw*0.42,h:sc(40)};
    var nb={x:mx2+mw-mw*0.44,y:my2+sc(108),w:mw*0.42,h:sc(40)};
    if(inRect(yb,cx,cy))confirmModal(true);else if(inRect(nb,cx,cy))confirmModal(false);
  }
});
canvasEl.addEventListener('touchstart',function(ev){
  ev.preventDefault();

    var jb=joyCenter();
    X.strokeStyle='rgba(255,255,255,0.14)';X.lineWidth=2.5;X.beginPath();X.arc(jb.cx,jb.cy,jb.r,0,Math.PI*2);X.stroke();
    X.fillStyle='rgba(255,255,255,0.05)';X.beginPath();X.arc(jb.cx,jb.cy,jb.r,0,Math.PI*2);X.fill();
    if(joy.on&&(joy.dx||joy.dy)){var jdm=Math.sqrt(joy.dx*joy.dx+joy.dy*joy.dy)||1,cl=Math.min(Math.sqrt(joy.dx*joy.dx+joy.dy*joy.dy),1)*jb.r;X.fillStyle='rgba(255,255,255,0.38)';X.beginPath();X.arc(jb.cx+joy.dx/jdm*cl,jb.cy+joy.dy/jdm*cl,jb.r*0.36,0,Math.PI*2);X.fill();}else{X.fillStyle='rgba(255,255,255,0.18)';X.beginPath();X.arc(jb.cx,jb.cy,jb.r*0.3,0,Math.PI*2);X.fill();}
    for(var i=0;i<3;i++){var spn2=P.spells[i];var def2=null;for(var j=0;j<SPELLS.length;j++){if(SPELLS[j].n===spn2){def2=SPELLS[j];break;}}var sp2b=[bl.sp0,bl.sp1,bl.sp2];drawBtn(sp2b[i],def2?(def2.e+' '+def2.n):('法術'+(i+1)),def2?def2.col:'#444',false,0);}
    drawBtn(bl.skA,P.classDef.skA,P.classCol,P.skAActive>0,P.skACd>0?P.skACd/250:0);
    drawBtn(bl.skB,P.classDef.skB,P.classCol,P.skBActive>0,P.skBCd>0?P.skBCd/300:0);
    drawBtn(bl.shr,'縮刀','#00b894',shr,0);
    drawBtn(bl.dsh,'衝刺','#6c5ce7',dashBtn.on&&P.dashCd<=0,0);
  }
  var mm={x:W-sc(70),y:sc(5),w:sc(65),h:sc(44)};
  X.fillStyle='rgba(0,0,0,0.5)';roundRect(mm.x,mm.y,mm.w,mm.h,5);X.fill();
  X.strokeStyle='rgba(255,255,255,0.1)';X.lineWidth=1;roundRect(mm.x,mm.y,mm.w,mm.h,5);X.stroke();
  var mpx=mm.x+(P.x/MAP.w)*mm.w,mpy=mm.y+(P.y/MAP.h)*mm.h;
  X.fillStyle=arena.col;X.beginPath();X.arc(mpx,mpy,3.5,0,Math.PI*2);X.fill();
  for(var i=0;i<ENE.length;i++){var emx=mm.x+(ENE[i].x/MAP.w)*mm.w,emy=mm.y+(ENE[i].y/MAP.h)*mm.h;X.fillStyle=ENE[i].col+'88';X.fillRect(emx-1.5,emy-1.5,3,3);}

  if(showModal){
    X.fillStyle='rgba(0,0,0,0.72)';X.fillRect(0,0,W,H);
    var mw=W*0.82,mh=sc(165),mx2=(W-mw)/2,my2=(H-mh)/2;
    X.fillStyle='#150f28';roundRect(mx2,my2,mw,mh,sc(16));X.fill();
    var allPool=WORKSHOPS.concat(ALTARS);
    var itm=allPool.find(function(w){return w.fn===showModal.type;})||{name:'?',icon:'?',col:'#fff',desc:'?'};
    var isShopM=WORKSHOPS.find(function(w){return w.fn===showModal.type;});
    X.strokeStyle=isShopM?'rgba(253,203,110,0.45)':'rgba(232,67,85,0.45)';X.lineWidth=2;roundRect(mx2,my2,mw,mh,sc(16));X.stroke();
    X.fillStyle=itm.col;X.font='bold '+sc(15)+'px Fredoka One,cursive';X.textAlign='center';X.fillText(itm.icon+' '+itm.name,W/2,my2+sc(30));
    X.fillStyle='rgba(255,255,255,0.7)';X.font=sc(10.5)+'px Nunito,sans-serif';
    var mlines=(itm.desc||'').split('\n');for(var li=0;li<mlines.length;li++)X.fillText(mlines[li],W/2,my2+sc(52)+li*sc(18));
    var yb={x:mx2+sc(18),y:my2+sc(108),w:mw*0.42,h:sc(40)};
    var nb={x:mx2+mw*0.56,y:my2+sc(108),w:mw*0.42,h:sc(40)};
    X.fillStyle='rgba(0,184,148,0.22)';roundRect(yb.x,yb.y,yb.w,yb.h,sc(10));X.fill();X.strokeStyle='#00b894';X.lineWidth=1.5;roundRect(yb.x,yb.y,yb.w,yb.h,sc(10));X.stroke();X.fillStyle='#00b894';X.font='bold '+sc(11.5)+'px Nunito,sans-serif';X.textAlign='center';X.textBaseline='middle';X.fillText('✓ 接受 [Y]',yb.x+yb.w/2,yb.y+yb.h/2);
    X.fillStyle='rgba(232,67,85,0.22)';roundRect(nb.x,nb.y,nb.w,nb.h,sc(10));X.fill();X.strokeStyle='#e84355';X.lineWidth=1.5;roundRect(nb.x,nb.y,nb.w,nb.h,sc(10));X.stroke();X.fillStyle='#e84355';X.fillText('✗ 拒絕 [N]',nb.x+nb.w/2,nb.y+nb.h/2);
    X.textBaseline='alphabetic';
  }

  if(dead){
    X.fillStyle='rgba(0,0,0,0.8)';X.fillRect(0,0,W,H);
    X.fillStyle='#e84355';X.font='bold '+sc(26)+'px Fredoka One,cursive';X.textAlign='center';X.fillText('冠鹿倒下了 🦌',W/2,H/2-sc(34));
    X.fillStyle='#fdcb6e';X.font='bold '+sc(13)+'px Nunito,sans-serif';X.fillText('分數 '+score+'  ·  層'+floorN+'  ·  殺'+P.kills,W/2,H/2+sc(5));
    X.fillStyle='rgba(255,255,255,0.38)';X.font=sc(10)+'px Nunito,sans-serif';X.fillText(isMobile?'點擊重新開始':'按 R 重新選擇',W/2,H/2+sc(30));
  }
}

window.addEventListener('resize',function(){resize();});
function loop(){update();draw();requestAnimationFrame(loop);}
resize();loop();
</script>
</body>
</html>
