<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>冠鹿怪大冒險</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation}
html,body{width:100%;height:100%;overflow:hidden;background:#f5efe6}
canvas{display:block;position:fixed;top:0;left:0;width:100%;height:100%;touch-action:none}

:root{
  --cream:#f5efe6;--warm:#e8d5b7;--soft-green:#a8d5a2;--soft-blue:#a8c5e0;
  --soft-pink:#f0a8b8;--soft-yellow:#f5d98c;--soft-purple:#c4aee8;
  --dark:#3d2b1f;--mid:#6b4c3b;--text:#4a3728;
  --ff:'Baloo 2',sans-serif;
}

/* ── TOP HUD ── */
#hud-top{
  position:fixed;top:0;left:0;right:0;
  padding:max(env(safe-area-inset-top),10px) 14px 10px;
  display:flex;justify-content:space-between;align-items:flex-start;
  pointer-events:none;z-index:10;
}
.panel{background:rgba(253,248,240,0.88);border-radius:18px;padding:8px 12px;
  box-shadow:0 2px 12px rgba(61,43,31,0.12);border:2px solid rgba(232,213,183,0.8);}
.hud-left{display:flex;flex-direction:column;gap:5px;min-width:160px}
.bar-row{display:flex;align-items:center;gap:6px}
.bl{font-family:var(--ff);font-size:13px;font-weight:700;color:var(--mid);min-width:18px;text-align:center}
.bwrap{flex:1;height:16px;background:rgba(61,43,31,0.1);border-radius:8px;overflow:hidden;position:relative;border:1.5px solid rgba(61,43,31,0.08)}
.bfill{height:100%;border-radius:8px;transition:width .12s}
.bval{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--ff);font-size:10px;font-weight:800;color:var(--dark)}
#hpf{background:linear-gradient(90deg,#f07888,#f5a0b0)}
#stf{background:linear-gradient(90deg,#78c878,#a0d8a0)}
#drf{background:linear-gradient(90deg,#8888e8,#b0b0f0)}

.hud-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right}
.score-big{font-family:var(--ff);font-size:26px;font-weight:800;color:var(--dark);line-height:1}
.info-small{font-family:var(--ff);font-size:12px;font-weight:700;color:var(--mid)}
#cls-tag{font-family:var(--ff);font-size:11px;font-weight:700;color:#8a6ebc}
#env-tag{font-family:var(--ff);font-size:10px;font-weight:700;color:#a0887a}

/* ── SPELL BAR ── */
#spell-bar{
  position:fixed;bottom:max(env(safe-area-inset-bottom),14px);
  left:50%;transform:translateX(-50%);
  display:flex;gap:8px;z-index:10;
}
.sslot{
  width:58px;height:58px;border-radius:16px;
  background:rgba(253,248,240,0.9);border:2.5px solid rgba(232,213,183,0.9);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:24px;position:relative;cursor:pointer;pointer-events:auto;
  box-shadow:0 2px 10px rgba(61,43,31,0.15);
}
.sslot .slabel{font-family:var(--ff);font-size:9px;font-weight:700;color:var(--mid);position:absolute;bottom:3px}
.sslot.has-spell{border-color:#c4aee8}
.sslot.cooling::after{content:'';position:absolute;inset:0;border-radius:14px;background:rgba(61,43,31,0.3)}

/* ── JOYSTICK ── */
#joy-zone{
  position:fixed;bottom:max(env(safe-area-inset-bottom),16px);left:16px;
  width:160px;height:160px;border-radius:50%;
  background:rgba(253,248,240,0.45);border:2.5px solid rgba(232,213,183,0.7);
  z-index:10;display:none;
}
#joy-knob{
  position:absolute;top:55px;left:55px;width:50px;height:50px;border-radius:50%;
  background:rgba(253,248,240,0.85);box-shadow:0 2px 10px rgba(61,43,31,0.2);
  pointer-events:none;border:2px solid rgba(232,213,183,0.8);
}

/* ── SKILL BUTTONS ── */
#skill-btns{
  position:fixed;bottom:max(env(safe-area-inset-bottom),16px);right:14px;
  display:none;flex-direction:column;gap:8px;z-index:10;
}
.sk-btn{
  width:66px;height:58px;border-radius:16px;
  background:rgba(253,248,240,0.9);border:2.5px solid rgba(232,213,183,0.9);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--ff);font-size:11px;font-weight:700;color:var(--mid);
  cursor:pointer;pointer-events:auto;box-shadow:0 2px 10px rgba(61,43,31,0.15);
  gap:2px;
}
.sk-btn .sk-ico{font-size:22px;line-height:1}
#dash-btn{border-color:rgba(168,197,224,0.9);color:#5588aa}
#shr-btn{border-color:rgba(168,213,162,0.9);color:#4a8a44}

/* ── TOAST ── */
#toast{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  font-family:var(--ff);font-size:17px;font-weight:800;
  color:var(--dark);text-align:center;
  background:rgba(253,248,240,0.95);border:2.5px solid rgba(232,213,183,0.9);
  border-radius:22px;padding:8px 22px;
  opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;
  box-shadow:0 4px 20px rgba(61,43,31,0.18);
}
#item-pop{
  position:fixed;top:max(env(safe-area-inset-top),10px);
  top:calc(max(env(safe-area-inset-top),10px) + 90px);
  left:50%;transform:translateX(-50%);
  background:rgba(253,248,240,0.95);border:2.5px solid rgba(196,174,232,0.7);
  border-radius:16px;padding:8px 18px;text-align:center;
  opacity:0;transition:opacity .25s;pointer-events:none;z-index:29;min-width:180px;
  box-shadow:0 3px 14px rgba(61,43,31,0.15);
}
.ipn{font-family:var(--ff);font-size:15px;font-weight:800;color:#6a4a9c}
.ipd{font-family:var(--ff);font-size:11px;font-weight:700;color:var(--mid);margin-top:2px}

/* ── MODAL ── */
#modal{
  position:fixed;inset:0;background:rgba(61,43,31,0.55);
  display:none;align-items:center;justify-content:center;z-index:40;
}
#modal.show{display:flex}
.mbox{
  background:#fdf8f0;border-radius:24px;padding:24px 20px;
  width:88%;max-width:360px;text-align:center;
  box-shadow:0 8px 40px rgba(61,43,31,0.25);border:3px solid rgba(232,213,183,0.9);
}
.mbox h2{font-family:var(--ff);font-size:20px;font-weight:800;color:var(--dark);margin-bottom:6px}
.mbox .mdesc{font-family:var(--ff);font-size:13px;font-weight:700;color:var(--mid);margin-bottom:18px;line-height:1.6}
.mbtns{display:flex;gap:12px}
.mbtn{flex:1;padding:14px 0;border-radius:14px;border:none;cursor:pointer;font-family:var(--ff);font-size:16px;font-weight:800}
.mbtn.yes{background:linear-gradient(135deg,#a8d5a2,#78c878);color:#1e4a1e}
.mbtn.no{background:linear-gradient(135deg,#f0a8b8,#e87888);color:#4a1e28}

/* ── SELECTION ── */
#sel{
  position:fixed;inset:0;overflow-y:auto;z-index:35;
  background:linear-gradient(160deg,#fdf8f0 0%,#f0e8d8 100%);
  padding:max(env(safe-area-inset-top),12px) 12px max(env(safe-area-inset-bottom),12px);
}
.sel-hd{font-family:var(--ff);font-size:22px;font-weight:800;color:var(--dark);text-align:center;margin:8px 0 2px}
.sel-sub{font-family:var(--ff);font-size:12px;font-weight:700;color:var(--mid);text-align:center;margin-bottom:12px;opacity:.7}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:8px}
.ccard{
  background:#fff;border-radius:18px;padding:12px 10px;cursor:pointer;
  border:2.5px solid rgba(232,213,183,0.8);
  box-shadow:0 2px 10px rgba(61,43,31,0.08);transition:transform .1s;
}
.ccard:active{transform:scale(.97)}
.ccard .cn{font-family:var(--ff);font-size:15px;font-weight:800;margin-bottom:3px}
.ccard .cs{font-family:var(--ff);font-size:10px;font-weight:700;color:var(--mid);line-height:1.5}
.ccard .cp{font-family:var(--ff);font-size:11px;font-weight:800;margin-top:4px}
.sel-back{font-family:var(--ff);font-size:13px;font-weight:700;color:var(--mid);text-align:center;margin-top:6px;opacity:.6}

/* ── DEAD ── */
#dead{
  position:fixed;inset:0;background:rgba(253,248,240,0.92);
  display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px;z-index:40;
}
#dead h1{font-family:var(--ff);font-size:32px;font-weight:800;color:#c04060}
#dead .ds{font-family:var(--ff);font-size:15px;font-weight:700;color:var(--mid)}
#dead .rbtn{
  margin-top:14px;padding:14px 36px;background:linear-gradient(135deg,#c4aee8,#8888e8);
  border:none;border-radius:16px;font-family:var(--ff);font-size:18px;font-weight:800;color:#fff;cursor:pointer;
  box-shadow:0 3px 14px rgba(136,136,232,0.35);
}
</style>
</head>
<body>
<canvas id="gc"></canvas>

<div id="hud-top">
  <div class="panel hud-left">
    <div id="cls-tag">-</div>
    <div class="bar-row"><span class="bl">❤</span><div class="bwrap"><div class="bfill" id="hpf" style="width:100%"></div><div class="bval" id="hpv">100</div></div></div>
    <div class="bar-row"><span class="bl">⚡</span><div class="bwrap"><div class="bfill" id="stf" style="width:100%"></div><div class="bval" id="stv">100</div></div></div>
    <div class="bar-row"><span class="bl">🗡</span><div class="bwrap"><div class="bfill" id="drf" style="width:100%"></div><div class="bval" id="drv">100</div></div></div>
  </div>
  <div class="panel hud-right">
    <div class="score-big" id="scv">0</div>
    <div class="info-small">Lv<span id="lvv">1</span> · 層<span id="flv">1</span> · 殺<span id="klv">0</span></div>
    <div id="env-tag">-</div>
  </div>
</div>

<div id="spell-bar">
  <div class="sslot" id="sl0" onclick="castSpell(0)" ontouchstart="castSpell(0)"><span id="sl0e">—</span><span class="slabel">法1</span></div>
  <div class="sslot" id="sl1" onclick="castSpell(1)" ontouchstart="castSpell(1)"><span id="sl1e">—</span><span class="slabel">法2</span></div>
  <div class="sslot" id="sl2" onclick="castSpell(2)" ontouchstart="castSpell(2)"><span id="sl2e">—</span><span class="slabel">法3</span></div>
  <div class="sslot" id="slA" onclick="doSkA()" ontouchstart="doSkA()"><span id="slAe">Q</span><span class="slabel" id="slAl">技A</span></div>
  <div class="sslot" id="slB" onclick="doSkB()" ontouchstart="doSkB()"><span id="slBe">E</span><span class="slabel" id="slBl">技B</span></div>
</div>

<div id="joy-zone"><div id="joy-knob"></div></div>

<div id="skill-btns">
  <div class="sk-btn" id="dash-btn" onclick="trigDash()" ontouchstart="trigDash()"><span class="sk-ico">💨</span>衝刺</div>
  <div class="sk-btn" id="shr-btn" ontouchstart="shrOn()" ontouchend="shrOff()"><span class="sk-ico">🔻</span>縮刀</div>
</div>

<div id="toast"></div>
<div id="item-pop"><div class="ipn" id="ipn"></div><div class="ipd" id="ipd"></div></div>

<div id="modal">
  <div class="mbox">
    <h2 id="mtitle">-</h2>
    <div class="mdesc" id="mdesc">-</div>
    <div class="mbtns">
      <button class="mbtn yes" onclick="confirmModal(true)">✓ 接受</button>
      <button class="mbtn no" onclick="confirmModal(false)">✗ 拒絕</button>
    </div>
  </div>
</div>

<div id="sel">
  <div class="sel-hd" id="sel-hd">選擇職業</div>
  <div class="sel-sub" id="sel-sub">1/3 選一個職業開始</div>
  <div class="cgrid" id="cgrid"></div>
  <div class="sel-back" id="sel-back"></div>
</div>

<div id="dead">
  <h1>🦌 冠鹿倒下了</h1>
  <div class="ds" id="ds1"></div>
  <div class="ds" id="ds2"></div>
  <button class="rbtn" onclick="goSel()">重新選擇</button>
</div>

<script>
// ─── globals ───────────────────────────
var C=document.getElementById('gc'),X=C.getContext('2d');
var W=0,H=0,isMob=false,frame=0;
var stage=0; // 0 1 2 = sel, 3 = game
var selC=null,selZ=null,selN=null;
var P=null,ENE=[],PROJ=[],PARTS=[],ITW=[],SPW=[],TRAPS=[],SCRAPS=[];

var WALLS=[];
var curW=null,curA=null;
var score=0,floorN=1,dead=false,modal=null;
var keys={};
var joyVec={x:0,y:0},joyActive=false,joyId=-1,joyOrig={x:0,y:0};
var aimId=-1,aimAng=0,aimMoved=false;

var iT=0,eT=0;

// ─── resize ────────────────────────────
function resize(){
  C.width=W=window.innerWidth;
  C.height=H=window.innerHeight;
  isMob=('ontouchstart' in window)||W<640;
  document.getElementById('joy-zone').style.display=isMob?'block':'none';
  document.getElementById('skill-btns').style.display=isMob?'flex':'none';
}
window.addEventListener('resize',resize);

// ─── helpers ───────────────────────────
function sc(v){return v*(Math.min(W,500)/500);}
function dst(ax,ay,bx,by){return Math.sqrt((ax-bx)*(ax-bx)+(ay-by)*(ay-by));}
function rrect(x,y,w,h,r){X.beginPath();X.moveTo(x+r,y);X.lineTo(x+w-r,y);X.arcTo(x+w,y,x+w,y+r,r);X.lineTo(x+w,y+h-r);X.arcTo(x+w,y+h,x+w-r,y+h,r);X.lineTo(x+r,y+h);X.arcTo(x,y+h,x,y+h-r,r);X.lineTo(x,y+r);X.arcTo(x,y,x+r,y,r);X.closePath();}
var _tt=null;
function toast(t){var el=document.getElementById('toast');el.textContent=t;el.style.opacity=1;clearTimeout(_tt);_tt=setTimeout(function(){el.style.opacity=0;},2000);}
var _pt=null;
function popItem(n,d,col){
  document.getElementById('ipn').textContent=n;document.getElementById('ipn').style.color=col||'#6a4a9c';
  document.getElementById('ipd').textContent=d||'';
  var el=document.getElementById('item-pop');el.style.opacity=1;clearTimeout(_pt);_pt=setTimeout(function(){el.style.opacity=0;},3200);
}
function addP(x,y,c,n,sp){n=n||6;sp=sp||2;for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,v=sp*(0.4+Math.random());PARTS.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,c:c,l:24+Math.random()*12,r:2.5+Math.random()*2});}}

  {id:'flicker',name:'瞬閃影刃',col:'#5ac8a0',emoji:'◎',hp:80,st:120,atk:14,rad:50,sz:13,spd:0.095,mass:0.5,skA:'影分身',skB:'瞬步刺',skAcost:25,skBcost:18},

  {id:'warden',name:'森之守衛',col:'#68b868',emoji:'⊛',hp:110,st:100,atk:18,rad:58,sz:19,spd:0.058,mass:1.2,skA:'自然之攫',skB:'生命綻放',skAcost:22,skBcost:28},
  {id:'aegis',name:'輝光之盾',col:'#78b0e0',emoji:'⬡',hp:160,st:90,atk:12,rad:70,sz:24,spd:0.035,mass:4,skA:'盾擊衝鋒',skB:'奉獻領域',skAcost:25,skBcost:35},
  {id:'etoile',name:'幻奏劍伶',col:'#e890b0',emoji:'✧',hp:95,st:110,atk:20,rad:56,sz:17,spd:0.052,mass:1,skA:'舞步切換',skB:'萬劍歸一',skAcost:0,skBcost:40},
  {id:'hunter',name:'獵空神衛',col:'#d8b830',emoji:'↑',hp:85,st:130,atk:18,rad:64,sz:15,spd:0.060,mass:0.8,skA:'箭雨風暴',skB:'集中火線',skAcost:22,skBcost:18},
  {id:'lancer',name:'龍鱗破軍',col:'#d85858',emoji:'↟',hp:120,st:100,atk:24,rad:80,sz:24,spd:0.042,mass:2,skA:'螺旋衝刺',skB:'橫掃千軍',skAcost:20,skBcost:28},
];
var ZODIACS=[
  {id:'aries',name:'♈白羊',col:'#e85858',passive:'撞擊回饋',desc:'衝刺碰撞力+30%不損耐'},

];

  {id:'rooster',name:'雞',emoji:'🐔',col:'#d8b830',passive:'鬥志高昂',desc:'新層前15秒轉速↑'},

var WEATHERS=[
  {id:'clear',name:'晴空',icon:'☀'},
  {id:'rain',name:'暴雨',icon:'🌧'},
  {id:'fog',name:'迷霧',icon:'🌫'},
  {id:'storm',name:'雷暴',icon:'⛈'},

// ─── SELECTION ─────────────────────────
function buildSel(){
  var lists=[CLASSES,ZODIACS,CHINESE];
  var titles=['選擇職業','選擇星座','選擇生肖'];
  var subs=['1/3 · 選一個職業','2/3 · 選擇星座天賦','3/3 · 選擇生肖守護'];
  var list=lists[stage];
  document.getElementById('sel-hd').textContent=titles[stage];
  document.getElementById('sel-sub').textContent=subs[stage];
  document.getElementById('sel-back').textContent=stage>0?'← 返回':'';
  var g=document.getElementById('cgrid');g.innerHTML='';
  list.forEach(function(item){
    var d=document.createElement('div');d.className='ccard';
    d.style.borderColor=(item.col||'#ccc')+'66';
    var line1='<div class="cn" style="color:'+(item.col||'#4a3728')+'">'+(item.emoji||item.icon||'')+' '+item.name+'</div>';
    var line2='';
    if(stage===0) line2='<div class="cs">HP:'+item.hp+' ATK:'+item.atk+'<br>Q:'+item.skA+'<br>E:'+item.skB+'</div>';
    else line2='<div class="cp" style="color:'+(item.col||'#6a4a9c')+'">'+item.passive+'</div><div class="cs">'+item.desc+'</div>';
    d.innerHTML=line1+line2;
    d.onclick=function(){clickSel(item);};
    g.appendChild(d);
  });
  document.getElementById('sel').style.display='block';
  document.getElementById('sel').scrollTop=0;
}
function clickSel(item){
  if(stage===0){selC=item;stage=1;}
  else if(stage===1){selZ=item;stage=2;}
  else{selN=item;startGame();}
  if(stage<3)buildSel();
}
document.getElementById('sel-back').addEventListener('click',function(){if(stage>0){stage--;buildSel();}});
function goSel(){
  stage=0;selC=selZ=selN=null;
  document.getElementById('dead').style.display='none';
  buildSel();
}

function rollEnv(){
  curW=WEATHERS[Math.floor(Math.random()*WEATHERS.length)];

  document.getElementById('env-tag').textContent=(curW.icon||'')+curW.name+'·'+curA.name;
}
function genMap(){
  WALLS=[];
  var th=80;
  WALLS.push({x:0,y:0,w:MAP.w,h:th},{x:0,y:MAP.h-th,w:MAP.w,h:th},{x:0,y:0,w:th,h:MAP.h},{x:MAP.w-th,y:0,w:th,h:MAP.h});
  [[500,350,70,220],[900,250,220,70],[750,680,70,200],[1400,500,200,70],[1100,950,70,220],[1700,280,70,300],[400,1100,220,70],[1300,1200,70,220],[900,1450,220,70],[1800,950,200,70],[500,1600,70,200],[1200,1750,220,70],[2000,600,70,200],[700,2000,200,70],[1600,1600,200,70]].forEach(function(p){WALLS.push({x:p[0],y:p[1],w:p[2],h:p[3]});});
}
function chkWall(nx,ny,r){for(var i=0;i<WALLS.length;i++){var w=WALLS[i];if(nx>w.x-r&&nx<w.x+w.w+r&&ny>w.y-r&&ny<w.y+w.h+r)return true;}return false;}
function spawnTraps(){
  TRAPS=[];
  var n=Math.min(2+Math.floor(floorN/2),6);
  [[600,600],[1200,500],[1000,1100],[1600,900],[800,1500],[1400,1400]].slice(0,n).forEach(function(s){TRAPS.push({type:Math.random()<0.5?'saw':'flame',x:s[0],y:s[1],r:36,ang:0,tmr:0});});
}

// ─── MODAL ─────────────────────────────
function openModal(fn,name,icon,col,desc){
  modal=fn;
  document.getElementById('mtitle').textContent=(icon||'')+'  '+name;
  document.getElementById('mtitle').style.color=col||'#4a3728';
  document.getElementById('mdesc').textContent=desc||'';
  document.getElementById('modal').classList.add('show');
}
function confirmModal(yes){
  if(!modal)return;
  var fn=modal;modal=null;
  document.getElementById('modal').classList.remove('show');
  if(!yes){toast('拒絕了');return;}
  if(fn==='grinder'){if(P.mhp>40){P.mhp-=20;P.hp=Math.min(P.mhp,P.hp);P.sw.atk+=8;toast('👴 攻+8，HP上限-20');}else toast('HP太低！');}
  else if(fn==='forger'){if(P.st>=50){P.st-=50;P.sw.mdur+=30;P.sw.dur=Math.min(P.sw.dur+30,P.sw.mdur);toast('🔨 耐久上限+30');}else toast('氣力不足！');}
  else if(fn==='alchemist'){if(P.hp>30){P.hp-=30;P.sw.poison=true;P._poisonTimer=360;toast('⚗️ 毒劍啟動');}else toast('HP不足！');}
  else if(fn==='apprentice'){P.spells=[null,null,null];var av=SPELLS.slice();for(var i=0;i<3;i++){if(!av.length)break;var idx=Math.floor(Math.random()*av.length);P.spells[i]=av[idx].n;av.splice(idx,1);}toast('🎓 法術×3！');updateSpellBar();}
  else if(fn==='merchant'){if(score>=100){score-=100;ITW.push({x:P.x+40,y:P.y,t:ITEMS[Math.floor(Math.random()*ITEMS.length)],r:18,pulse:0});toast('🛒 獲得道具！');}else toast('分數不足！');}
  else if(fn==='gamble'){P.sw.glass=true;P.sw.atk=Math.floor(P.sw.atk*2.5);P.sw.dur=30;P.sw.mdur=30;toast('🎲 玻璃劍！攻×2.5');}
  else if(fn==='blood'){if(P.hp>40){P.hp-=40;ENE.forEach(function(e){e.stun=180;});toast('💀 全場暈眩！');}else toast('HP不足！');}
  else if(fn==='fate'){var near=null,nd=99999;ENE.forEach(function(e){var d=dst(P.x,P.y,e.x,e.y);if(d<nd){nd=d;near=e;}});if(near){var tmp=P.sw.atk;P.sw.atk=Math.floor(near.sw.atk*4);near.sw.atk=Math.floor(tmp/4);toast('🌀 屬性互換！');}else toast('沒有敵人！');}
  else if(fn==='meteor'){var st2=P.st;P.st=0;ENE.forEach(function(e,i){setTimeout(function(){e.hp-=st2*0.4;e.fl=12;e.stun=40;addP(e.x,e.y,'#d8b830',12,4);},i*80);});toast('⭐ 流星雨！');}
  else if(fn==='void'){if(P.sw.dur>20){TRAPS.push({type:'saw',x:P.x,y:P.y,r:32,ang:0,tmr:0,permanent:true});P.sw.dur=Math.max(5,P.sw.dur-30);toast('🕳️ 永久陷阱！');}else toast('耐久不足！');}
}

// ─── COLLECT ───────────────────────────
function collectI(it){
  addP(it.x,it.y,it.t.col,10,2.5);
  popItem(it.t.n,it.t.desc||'',it.t.col);
  var fn=it.t.fn;
  if(fn==='whet'){P.sw.dur=Math.min(P.sw.mdur,P.sw.dur+60);if(P.zod.id==='virgo'){P.virgo_bonus=(P.virgo_bonus||0)+0.02;P.sw.atk=Math.floor(P.classDef.atk*(1+P.virgo_bonus));}}
  else if(fn==='whet2'){P.sw.dur=Math.min(P.sw.mdur,P.sw.dur+50);P.sw.explodeNext=true;}
  else if(fn==='heal')P.hp=Math.min(P.mhp,P.hp+35);
  else if(fn==='stam')P.st=Math.min(P.mst,P.st+50);
  else if(fn==='spell'){var av=SPELLS.filter(function(s){return P.spells.indexOf(s.n)===-1;});var slot=P.spells.indexOf(null);if(av.length&&slot!==-1){P.spells[slot]=av[Math.floor(Math.random()*av.length)].n;updateSpellBar();}}
  else if(fn==='spd')P.spd2=380;
  else if(fn==='bomb'){ENE.forEach(function(e){if(dst(P.x,P.y,e.x,e.y)<180){e.hp-=80;e.fl=10;e.stun=45;addP(e.x,e.y,'#d8b830',14,3);}});addP(P.x,P.y,'#d8b830',20,5);}
  else openModal(fn,it.t.n,it.t.e||'',it.t.col,it.t.desc||'');
}

// ─── SKILLS ────────────────────────────
function doSkA(){
  if(!P||modal||stage!==3||dead)return;
  var id=P.classId,cls=P.classDef,cost=cls.skAcost;
  if((P.st<cost&&cost>0)||P.skACd>0){toast(P.skACd>0?'冷卻中':'氣力不足！');return;}
  P.st=Math.max(0,P.st-cost);
  var ang=aimMoved?aimAng:P.sw.a;
  if(id==='crag'){var OR=P.sw.rad;P.sw.rad=OR*2.2;ENE.forEach(function(e){if(dst(P.x,P.y,e.x,e.y)<P.sw.rad+e.r){var kd=Math.atan2(e.y-P.y,e.x-P.x);e.vx=Math.cos(kd)*10;e.vy=Math.sin(kd)*9;e.stun=45;e.sw.dur=Math.max(0,e.sw.dur-30);addP(e.x,e.y,'#e8903a',12,5);}});addP(P.x,P.y,'#e8903a',22,6);setTimeout(function(){if(P)P.sw.rad=P.sw.bRad;},400);P.skACd=200;toast('震盪猛擊！');}
  else if(id==='flicker'){P._phantoms=[];for(var k=0;k<3;k++){var pa=P.sw.a+k/3*Math.PI*2;P._phantoms.push({x:P.x+Math.cos(pa)*30,y:P.y+Math.sin(pa)*30,ang:pa,tmr:180});}P.phantomTimer=180;P.skACd=240;toast('影分身！');}
  else if(id==='weaver'){var boom=P.spells.filter(function(s){return s;}).length>0?65:38;ENE.forEach(function(e){if(dst(P.x,P.y,e.x,e.y)<P.sw.rad*1.9){e.hp-=boom;e.stun=30;e.fl=10;var kd=Math.atan2(e.y-P.y,e.x-P.x);e.vx=Math.cos(kd)*5;e.vy=Math.sin(kd)*5;}});addP(P.x,P.y,'#9090d8',20,4);P.skACd=200;toast('元素共振！');}
  else if(id==='warden'){var near=null,nd=99999;ENE.forEach(function(e){var d=dst(P.x,P.y,e.x,e.y);if(d<nd){nd=d;near=e;}});if(near&&nd<350){near.sw.dur=Math.max(0,near.sw.dur-40);near.stun=55;near.slow=130;addP(near.x,near.y,'#68b868',14,3);toast('自然之攫！');}P.skACd=180;}
  else if(id==='aegis'){P.dashActive=18;P.dashCd=20;P.dashVx=Math.cos(ang);P.dashVy=Math.sin(ang);P.parry=18;P.skAActive=18;P.skACd=220;toast('盾擊衝鋒！');}
  else if(id==='etoile'){var orbs=['circle','ellipse','inf'];var idx=orbs.indexOf(P.sw.orbitType||'circle');P.sw.orbitType=orbs[(idx+1)%orbs.length];P.skACd=30;toast('軌跡:'+P.sw.orbitType);}
  else if(id==='hunter'){for(var i=0;i<6;i++){(function(d,a2){setTimeout(function(){if(!P)return;PROJ.push({x:P.x,y:P.y,vx:Math.cos(a2)*5.5,vy:Math.sin(a2)*5.5,r:7,col:'#d8b830',dmg:32,life:220,type:'arrow'});},d);})(i*120,P.sw.a+i/6*Math.PI*2);}P.skACd=200;toast('箭雨風暴！');}
  else if(id==='lancer'){P.spiralCharge=120;P.dashActive=120;var mv=getMov();P.dashVx=mv.x||Math.cos(ang);P.dashVy=mv.y||Math.sin(ang);P.skACd=220;toast('螺旋衝刺！');}
  if(P.zod.id==='gemini'&&Math.random()<0.25)setTimeout(doSkA,280);
  if(P.cn.id==='monkey')P.monkeySwapReady=true;
}

function castSpell(idx){
  if(!P||modal||stage!==3||dead)return;
  var spn=P.spells[idx];if(!spn)return;
  var def=SPELLS.find(function(s){return s.n===spn;});if(!def)return;
  var boost=(P.classId==='weaver'?1.5:1)*(P.cn.id==='dragon'?1.3:1)*(curW&&curW.id==='aurora'?1.3:1);
  if(P.st<def.cost){toast('氣力不足！');return;}
  P.st-=def.cost;
  var ang=aimMoved?aimAng:P.sw.a;
  if(spn==='火球')PROJ.push({x:P.x,y:P.y,vx:Math.cos(ang)*7.5,vy:Math.sin(ang)*7.5,r:11,col:'#e87850',dmg:46*boost,life:220,type:'fire',trail:[]});
  else if(spn==='手裡劍'){for(var i=0;i<8;i++){var a=i/8*Math.PI*2;PROJ.push({x:P.x,y:P.y,vx:Math.cos(a)*5.8,vy:Math.sin(a)*5.8,r:7,col:'#9898b0',dmg:24*boost,life:180,type:'shuriken',spin:0});}}
  else if(spn==='雷電'){var sorted=ENE.slice().sort(function(a,b){return dst(P.x,P.y,a.x,a.y)-dst(P.x,P.y,b.x,b.y);});for(var i=0;i<Math.min(4,sorted.length);i++){(function(e,d){setTimeout(function(){e.hp-=50*boost;e.fl=10;addP(e.x,e.y,'#d8c028',10,3);SPW.push({type:'ltng',x1:P.x,y1:P.y,x2:e.x,y2:e.y,l:16});},d);})(sorted[i],i*100);}}
  else if(spn==='盾牌'){P.shield=1;P.shieldT=300;}
  else if(spn==='冰凍'){ENE.forEach(function(e){if(dst(P.x,P.y,e.x,e.y)<280)e.frz=230;});}
  toast(spn+'！');P.spells[idx]=null;updateSpellBar();
  if(P.zod.id==='gemini'&&Math.random()<0.25)setTimeout(function(){castSpell(idx);},280);
}
function gainXP(n){

function getMov(){
  if(isMob){if(joyActive&&(joyVec.x||joyVec.y))return{x:joyVec.x,y:joyVec.y};return{x:0,y:0};}
  var mx=0,my=0;
  if(keys['a']||keys['A']||keys['ArrowLeft'])mx-=1;if(keys['d']||keys['D']||keys['ArrowRight'])mx+=1;
  if(keys['w']||keys['W']||keys['ArrowUp'])my-=1;if(keys['s']||keys['S']||keys['ArrowDown'])my+=1;
  if(mx||my){var m=Math.sqrt(mx*mx+my*my);return{x:mx/m,y:my/m};}return{x:0,y:0};
}
function trigDash(){
  if(!P||dead||P.dashCd>0||P.st<18)return;
  var mv=getMov();if(!mv.x&&!mv.y)return;
  P.dashActive=10;P.dashCd=38;P.st-=18;P.dashVx=mv.x;P.dashVy=mv.y;P.parry=14;
  addP(P.x,P.y,'#78b0e0',9,3);if(P.zod.id==='aries')P.parry=22;
}

// ─── UPDATE ────────────────────────────
function update(){
  if(dead||modal||stage!==3)return;
  frame++;
  var zod=P.zod,cn=P.cn;

  // zodiac passives
  if(zod.id==='cancer'){P.tideAngle+=0.012*P.tideDir;if(P.tideAngle>1)P.tideDir=-1;if(P.tideAngle<0)P.tideDir=1;P.sw.rad=P.sw.bRad*(0.72+P.tideAngle*0.56);}
  if(zod.id==='leo'){if(P.leoTimer>0)P.leoTimer--;else P.leoReady=true;}
  if(zod.id==='aquarius'){ITW.forEach(function(it){var di=dst(P.x,P.y,it.x,it.y);if(di<220&&di>1){it.x+=(P.x-it.x)/di*2.8;it.y+=(P.y-it.y)/di*2.8;}});}
  if(zod.id==='capricorn'){var mv2=getMov();if(!mv2.x&&!mv2.y){P.capricornStill++;if(P.capricornStill>=60&&!P.capricornShield){P.capricornShield=1;toast('魔羯護盾！');}}else P.capricornStill=0;}
  if(cn.id==='horse'){var mv3=getMov();P.sw.as=P.classDef.spd*(1+Math.hypot(mv3.x,mv3.y)*0.5);}
  if(cn.id==='rooster'&&P.roosterTimer>0){P.roosterTimer--;P.sw.as=Math.max(P.sw.as,P.classDef.spd*1.8);}
  if(P.libra_speedTimer>0)P.libra_speedTimer--;
  if(P.pigInvTimer>0)P.pigInvTimer--;
  if(P._poisonTimer>0)P._poisonTimer--;else if(P.sw.poison)P.sw.poison=false;
  if(P.invuln>0)P.invuln--; // ← player invuln frames

  if(P.spd2>0)P.spd2--;
  if(P.shield&&(--P.shieldT)<=0)P.shield=0;
  if(P.dashCd>0)P.dashCd--;if(P.dashActive>0)P.dashActive--;if(P.parry>0)P.parry--;
  if(P.skACd>0)P.skACd--;if(P.skBCd>0)P.skBCd--;if(P.skAActive>0)P.skAActive--;
  if(P.skBActive>0){P.skBActive--;if(P.skBActive<=0&&P.classId==='crag')P.sw.rad=P.sw.bRad;}
  if(P.phantomTimer>0){P.phantomTimer--;if(P.phantomTimer<=0)P._phantoms=[];}
  if(P.focusedSight>0)P.focusedSight--;
  if(P.spiralCharge>0){P.spiralCharge--;if(P.spiralCharge<=0)P.dashActive=0;}
  if(P.megaBladeTimer>0){P.megaBladeTimer--;P.megaBladeAngle+=0.06;}
  if(P.vampireMode>0)P.vampireMode--;
  if(P.consecZone&&(--P.consecZone.timer<=0))P.consecZone=null;
  if(P.classId==='weaver'&&P.skBActive>0)P.sw.dur=Math.max(0,P.sw.dur-0.3);

  var doShr=(isMob?shrinking:(keys['z']||keys['Z']))&&P.st>0;
  if(doShr&&frame%2===0)P.st=Math.max(0,P.st-0.7);
  var heatF=curW&&curW.id==='heat'?0.7:1;
  var sandF=curW&&curW.id==='sand'?1.25:1;
  if(zod.id!=='cancer'){var tR=doShr?20:P.sw.bRad;if(P.classId==='crag'&&P.skBActive>0)tR=20;P.sw.rad+=(tR-P.sw.rad)*0.12;}
  if(!doShr&&P.st<P.mst&&frame%3===0)P.st=Math.min(P.mst,P.st+0.44*heatF);
  P.sw.a+=P.sw.as;

  // movement with vx/vy bounce (S1 style)
  var mov=getMov(),dashing=P.dashActive>0;
  var spd=(P.spd2>0?P.spd*1.7:P.spd)*(dashing&&!P.spiralCharge?3.0:1)*(P.spiralCharge>0?2.6:1)*(P.libra_speedTimer>0?1.4:1)*(P.pigInvTimer>0?1.55:1);
  P.vx*=0.8;P.vy*=0.8; // friction like S1
  var nx=P.x,ny=P.y;
  if(dashing){nx+=P.dashVx*spd+P.vx;ny+=P.dashVy*spd+P.vy;}
  else if(mov.x||mov.y){nx+=mov.x*spd+P.vx;ny+=mov.y*spd+P.vy;}
  else{nx+=P.vx;ny+=P.vy;}
  if(!chkWall(nx,ny,P.r)){P.x=nx;P.y=ny;}
  else if(!chkWall(nx,P.y,P.r)){P.x=nx;P.vx*=0.2;}
  else if(!chkWall(P.x,ny,P.r)){P.y=ny;P.vy*=0.2;}
  P.x=Math.max(90,Math.min(MAP.w-90,P.x));P.y=Math.max(90,Math.min(MAP.h-90,P.y));

  if(!isMob&&(keys['Shift']||keys['shift'])&&P.dashCd<=0&&P.st>=18&&(mov.x||mov.y)){P.dashActive=10;P.dashCd=38;P.st-=18;P.dashVx=mov.x;P.dashVy=mov.y;P.parry=14;addP(P.x,P.y,'#78b0e0',9,3);if(zod.id==='aries')P.parry=22;}

  MAP.cx+=(P.x-W/2-MAP.cx)*0.1;MAP.cy+=(P.y-H/2-MAP.cy)*0.1;
  MAP.cx=Math.max(0,Math.min(MAP.w-W,MAP.cx));MAP.cy=Math.max(0,Math.min(MAP.h-H,MAP.cy));

  // scraps
  for(var si=SCRAPS.length-1;si>=0;si--){if(dst(P.x,P.y,SCRAPS[si].x,SCRAPS[si].y)<32){P.scraps++;P.hardness=Math.min(P.hardness+2,32);SCRAPS.splice(si,1);popItem('武器碎片','硬度+2','#9898b0');}}
  // traps
  TRAPS.forEach(function(trap){trap.ang+=0.09;trap.tmr++;var ta=trap.type==='saw'||(trap.tmr%80<40);if(!P.shield&&!dashing&&P.pigInvTimer<=0&&dst(P.x,P.y,trap.x,trap.y)<P.r+trap.r*0.7&&ta){P.hp-=0.9;}});
  // items
  var nI=[];ITW.forEach(function(it){it.pulse+=0.07;if(dst(P.x,P.y,it.x,it.y)<P.r+it.r)collectI(it);else nI.push(it);});ITW=nI;
  iT++;if(iT>460){iT=0;spawnI();}
  // enemy spawn — scales with floor
  var maxE=6+floorN*3; // ← more enemies per floor
  var spawnInterval=Math.max(80,240-floorN*15);
  eT++;if(eT>spawnInterval&&ENE.length<maxE){eT=0;spawnE();}
  if(curW&&curW.id==='storm'&&frame%1200===0&&ENE.length>0){var tgt=ENE[Math.floor(Math.random()*ENE.length)];tgt.hp-=65;tgt.stun=45;tgt.fl=16;addP(tgt.x,tgt.y,'#d8c028',20,5);SPW.push({type:'ltng',x1:tgt.x,y1:tgt.y-220,x2:tgt.x,y2:tgt.y,l:20});toast('⚡ 雷暴！');}

  // weapon tip
  var pTp={x:P.x+Math.cos(P.sw.a)*P.sw.rad, y:P.y+Math.sin(P.sw.a)*P.sw.rad};

  // ── ENEMY LOOP ─────────────────────────
  for(var ei=ENE.length-1;ei>=0;ei--){
    var e=ENE[ei];
    if(e.invuln>0)e.invuln--;
    if(e.frz>0){e.frz--;continue;}if(e.stun>0){e.stun--;continue;}
    if(e.disarmed>0)e.disarmed--;
    var sf=e.slow>0?0.42:1;if(e.slow>0)e.slow--;
    var edx=P.x-e.x,edy=P.y-e.y,ed=dst(P.x,P.y,e.x,e.y)||1;
    e.vx*=0.8;e.vy*=0.8; // friction
    var nx3=e.x+edx/ed*e.spd*sf+e.vx,ny3=e.y+edy/ed*e.spd*sf+e.vy;
    if(!chkWall(nx3,ny3,e.r)){e.x=nx3;e.y=ny3;}
    if(e.disarmed<=0)e.sw.a+=e.sw.as;
    if(e.fl>0)e.fl--;if(e.psn>0){e.psn--;if(e.psn%25===0)e.hp-=3;}
    if(e.sw.corrosion&&frame%60===0)e.sw.dur=Math.max(0,e.sw.dur-8);

    // enemy weapon tip
    var eTp={x:e.x+Math.cos(e.sw.a)*e.sw.rad, y:e.y+Math.sin(e.sw.a)*e.sw.rad};

    // ── 1. WEAPON CLASH (S1 style) ──────────────────────────────
    // dist between weapon tips < szA + szB → clash
    if(e.disarmed<=0&&P.sw.clashCd<=0&&e.sw.clashCd<=0){
      var cDist=dst(pTp.x,pTp.y,eTp.x,eTp.y);
      var cMin=P.sw.sz+e.sw.sz;
      if(cDist<cMin){
        // sparks
        addP((pTp.x+eTp.x)/2,(pTp.y+eTp.y)/2,'#f5d98c',22,5.5);
        SPW.push({type:'clash',x:(pTp.x+eTp.x)/2,y:(pTp.y+eTp.y)/2,l:18});

        // ── REPULSE BOTH BODIES (S1: player.vx += dx*0.15, e.vx -= dx*0.3) ──
        var cdx=pTp.x-eTp.x,cdy=pTp.y-eTp.y;
        P.vx+=cdx*0.15;P.vy+=cdy*0.15;
        e.vx-=cdx*0.30;e.vy-=cdy*0.30;

        // ── WEAPON ANGLE BOUNCE (彈開方向旋轉) ──
        // Player weapon bounces away from collision direction
        var clashAng=Math.atan2(cdy,cdx);
        // reflect weapon angle based on mass ratio
        var pMass=P.sw.mass||1,eMass=e.sw.mass||1;
        var bounce=(P.sw.as<0?-1:1)*(0.3+Math.random()*0.3)/pMass;
        P.sw.as=-P.sw.as*0.7+bounce; // reverse and add random spin
        e.sw.as=-e.sw.as*0.7-(P.sw.as<0?-1:1)*0.2/eMass;
        // clamp to reasonable speed range
        P.sw.as=Math.max(-0.14,Math.min(0.14,P.sw.as));
        e.sw.as=Math.max(-0.12,Math.min(0.12,e.sw.as));

        // ── DURABILITY DAMAGE (S1: dur -= other.atk * 0.5) ──
        var noLoss=P.classId==='aegis'||(P.classId==='crag'&&P.skBActive>0);
        var tauB=zod.id==='taurus'?0.8:1;
        if(!noLoss)P.sw.dur=Math.max(0,P.sw.dur-e.sw.atk*0.5*tauB*sandF-P.hardness*(-0.1));
        P.sw.dur=Math.max(0,P.sw.dur); // clamp
        e.sw.dur=Math.max(0,e.sw.dur-(P.sw.atk*0.5+(P.hardness||0)*0.1));
        if(zod.id==='aries'&&P.dashActive>0){e.sw.dur=Math.max(0,e.sw.dur-P.sw.atk*0.3);} // bonus

        // special: parry window
        if(P.parry>0||(P.classId==='aegis'&&P.skAActive>0)){
          var isAC=P.classId==='aegis'&&P.skAActive>0;
          if(isAC){e.disarmed=130;toast('盾擊！失去武器！');}
          e.vx-=cdx*0.6;e.vy-=cdy*0.6;e.stun=40+(P.classId==='crag'?24:0);
          SPW.push({type:'parry',x:(pTp.x+eTp.x)/2,y:(pTp.y+eTp.y)/2,l:20});
          if(!isAC)toast('✨ 完美架擋！');P.parry=0;P.skAActive=0;
          if(zod.id==='leo'&&P.leoReady){ENE.forEach(function(en){if(dst(P.x,P.y,en.x,en.y)<240){en.stun=100;en.fl=14;}});P.leoReady=false;P.leoTimer=600;toast('♌ 震懾金光！');}
        }
        // explode
        if(P.sw.explodeNext){addP((pTp.x+eTp.x)/2,(pTp.y+eTp.y)/2,'#d8b830',26,6);e.hp-=62;e.stun=36;P.sw.explodeNext=false;toast('💥 淬火爆炸！');}
        // glass
        if(P.sw.glass&&P.sw.dur<=0){SCRAPS.push({x:P.x+28,y:P.y});P.sw.atk=10;P.sw.glass=false;P.sw.dur=20;P.sw.mdur=60;toast('💔 玻璃劍碎裂！');}
        // enemy weapon break
        if(e.sw.dur<=0&&!e._scrapped){e._scrapped=true;SCRAPS.push({x:e.x+22,y:e.y});toast('💥 敵人武器碎！');if(cn.id==='tiger'){P.sw.atk=Math.floor(P.sw.atk*1.22);setTimeout(function(){if(P)P.sw.atk=Math.floor(P.sw.atk/1.22);},320);}if(zod.id==='scorpio')e.hp-=35;}
        // extra passives
        if(cn.id==='snake')e.sw.mass=Math.max(0.2,(e.sw.mass||1)*0.72);
        if(cn.id==='rat'&&Math.random()<0.10)P.hp=Math.min(P.mhp,P.hp+5);
        if(cn.id==='sheep'&&Math.random()<0.15)P.hp=Math.min(P.mhp,P.hp+2);
        if(cn.id==='monkey'&&P.monkeySwapReady){var tx3=P.x,ty3=P.y;P.x=e.x;P.y=e.y;e.x=tx3;e.y=ty3;P.monkeySwapReady=false;toast('🐒 換位！');}
        if(zod.id==='libra'){if((e.sw.mass||1)>(P.sw.mass||1))P.libra_speedTimer=90;else e.sw.dur=Math.max(0,e.sw.dur-9);}

        // cooldown (S1 style: 15 frames)
        P.sw.clashCd=15;e.sw.clashCd=15;
      }
    }
    if(P.sw.clashCd>0)P.sw.clashCd--;
    if(e.sw.clashCd>0)e.sw.clashCd--;

    // ── 2. PLAYER WEAPON TIP vs ENEMY BODY ──────────────────────
    if(dst(pTp.x,pTp.y,e.x,e.y)<P.sw.sz+e.r){
      var dmg=P.sw.atk*(P.sw.dur/P.sw.mdur)*(P.classId==='warden'?0.44:0.28);
      if(P.megaBladeTimer>0)dmg*=2.3;if(zod.id==='sagittarius')dmg*=1.2;
      e.hp-=dmg;if(P.sw.poison)e.psn=150;e.fl=5;
      // knockback (S1 style)
      var kb_dx=pTp.x-e.x,kb_dy=pTp.y-e.y;
      e.vx+=kb_dx*0.2;e.vy+=kb_dy*0.2;
      addP(pTp.x,pTp.y,P.classCol,4,2);
      if(P.vampireMode>0)P.hp=Math.min(P.mhp,P.hp+3);
      if(P.consecZone&&dst(P.x,P.y,e.x,e.y)<P.consecZone.r)e.hp-=16;
      if(P.classId==='hunter'&&Math.random()<0.25){var ha=Math.atan2(e.y-P.y,e.x-P.x);PROJ.push({x:pTp.x,y:pTp.y,vx:Math.cos(ha)*5.8,vy:Math.sin(ha)*5.8,r:7,col:'#d8b830',dmg:25,life:160,type:'arrow'});}
      if(zod.id==='scorpio'&&Math.random()<0.15)e.sw.corrosion=true;
    }

    // ── 3. ENEMY WEAPON TIP vs PLAYER BODY (with invuln, S1 style) ──
    if(e.disarmed<=0&&P.invuln<=0&&!P.shield){
      if(dst(eTp.x,eTp.y,P.x,P.y)<e.sw.sz+P.r){
        var atkDmg=e.sw.atk*(e.sw.dur/e.sw.mdur);
        P.hp-=atkDmg;
        P.invuln=30; // ← 30 frame invuln, NO continuous damage
        // knockback to player (S1)
        var kbdx=eTp.x-P.x,kbdy=eTp.y-P.y;
        P.vx+=kbdx*0.2;P.vy+=kbdy*0.2;
        addP(P.x,P.y,'#f0a8b8',8,2.5);
        if(P.capricornShield>0){P.capricornShield=0;P.hp=Math.min(P.mhp,P.hp+atkDmg*0.8);toast('魔羯護盾！');}
      }
    }
    // shield block
    if(P.shield&&e.disarmed<=0&&dst(eTp.x,eTp.y,P.x,P.y)<e.sw.sz+P.r+12){
      ENE.forEach(function(en){var d=dst(en.x,P.x,en.y,P.y);if(d<160){var a2=Math.atan2(en.y-P.y,en.x-P.x);en.vx=Math.cos(a2)*8;en.vy=Math.sin(a2)*8;}});
      addP(P.x,P.y,'#78b0e0',14,4);P.shield=0;P.shieldT=0;toast('🛡️ 護盾格擋！');P.invuln=25;
    }

    // ── 4. ENEMY BODY vs PLAYER BODY (strong pushback, no direct damage) ──
    // S1 style: strong repulse with takeDamage; here we do it without continuous tick
    if(e.invuln<=0&&dst(P.x,P.y,e.x,e.y)<P.r+e.r){
      var ba=Math.atan2(P.y-e.y,P.x-e.x);
      P.vx+=Math.cos(ba)*7;P.vy+=Math.sin(ba)*7;
      e.vx-=Math.cos(ba)*4;e.vy-=Math.sin(ba)*4;
      e.invuln=20;
      // small damage once (body contact)
      if(P.invuln<=0){P.hp-=4;P.invuln=20;addP(P.x,P.y,'#f0a8b8',4,2);}
    }

    // trap vs enemy
    TRAPS.forEach(function(trap){var ta=trap.type==='saw'||(trap.tmr%80<40);if(ta&&dst(e.x,e.y,trap.x,trap.y)<e.r+trap.r*0.8){e.hp-=3.8;e.fl=4;}});

    if(e.hp<=0){
      addP(e.x,e.y,e.col,20,3.8);
      var xv=e.type==='boss'?34:e.type==='knight'?18:e.type==='goblin'?11:7;
      gainXP(xv*(curW&&curW.id==='eclipse'?2:1));
      score+=xv*14*(1+Math.floor(P.lv/3));P.kills++;
      if(P.kills%10===0)spawnI();ENE.splice(ei,1);
    }
  } // end enemy loop

  // projectiles
  for(var pi=PROJ.length-1;pi>=0;pi--){
    var proj=PROJ[pi];proj.x+=proj.vx;proj.y+=proj.vy;proj.life--;
    if(proj.trail){proj.trail.push({x:proj.x,y:proj.y,l:13});for(var tli=proj.trail.length-1;tli>=0;tli--){if(--proj.trail[tli].l<=0)proj.trail.splice(tli,1);}}
    if(proj.type==='shuriken')proj.spin=(proj.spin||0)+0.38;
    if(chkWall(proj.x,proj.y,proj.r)){proj.life=0;continue;}
    for(var ei2=ENE.length-1;ei2>=0;ei2--){if(dst(proj.x,proj.y,ENE[ei2].x,ENE[ei2].y)<ENE[ei2].r+proj.r){ENE[ei2].hp-=proj.dmg;ENE[ei2].fl=9;addP(ENE[ei2].x,ENE[ei2].y,proj.col,8,3.5);proj.life=0;break;}}
    if(proj.life<=0)PROJ.splice(pi,1);
  }
  for(var si2=SPW.length-1;si2>=0;si2--){if(--SPW[si2].l<=0)SPW.splice(si2,1);}
  for(var pai=PARTS.length-1;pai>=0;pai--){var pp=PARTS[pai];pp.x+=pp.vx;pp.y+=pp.vy;pp.vx*=0.9;pp.vy*=0.9;if(--pp.l<=0)PARTS.splice(pai,1);}

  // floor
  if(score>=floorN*1200){floorN++;rollEnv();toast((curW.icon||'')+'→ 進入'+curA.name+'！');spawnTraps();for(var i=0;i<3+Math.min(floorN,4);i++)spawnE();if(P.cn.id==='rooster')P.roosterTimer=900;}

  if(P.hp<=0){
    dead=true;
    document.getElementById('ds1').textContent='分數：'+score;
    document.getElementById('ds2').textContent='層'+floorN+' · Lv'+P.lv+' · 殺'+P.kills;
    document.getElementById('dead').style.display='flex';
  }
  updateHUD();
}

// ─── DRAW ──────────────────────────────
// Draw diamond sword (S1 shape, elongated for sword feel)
function drawDiamond(wx,wy,sz,col,strokeCol,ang,glowCol){
  X.save();X.translate(wx,wy);X.rotate(ang+Math.PI/4);
  if(glowCol){X.shadowColor=glowCol;X.shadowBlur=14;}
  X.fillStyle=col;X.strokeStyle=strokeCol||'rgba(0,0,0,0.15)';X.lineWidth=1.5;
  X.beginPath();
  X.moveTo(0,-sz*1.9);   // forward tip (S1: moveTo(0,-s))
  X.lineTo(sz*0.55,0);   // right (S1: lineTo(s/2,0))
  X.lineTo(0,sz*0.55);   // back (S1: lineTo(0,s/2))
  X.lineTo(-sz*0.55,0);  // left (S1: lineTo(-s/2,0))
  X.closePath();X.fill();X.stroke();
  X.shadowBlur=0;X.restore();
}

function drawPlayer(cx,cy){
  var r=P.r,col=P.classCol;
  var flashing=P.invuln>0&&Math.floor(frame/3)%2===0; // blink when invuln
  X.save();X.translate(cx,cy);
  // soft glow aura
  var grad=X.createRadialGradient(0,0,r*0.5,0,0,r*2.2);
  grad.addColorStop(0,col+'28');grad.addColorStop(1,'transparent');
  X.fillStyle=grad;X.beginPath();X.arc(0,0,r*2.2,0,Math.PI*2);X.fill();
  // body
  X.beginPath();
  for(var k=0;k<18;k++){
    var a=k/18*Math.PI*2-Math.PI/2;
    var rr2=r*(k>=11&&k<=16?0.88:1)*(1+Math.sin(k*2.7+frame*0.04)*0.06);
    if(k===0)X.moveTo(Math.cos(a)*rr2,Math.sin(a)*rr2);else X.lineTo(Math.cos(a)*rr2,Math.sin(a)*rr2);
  }
  X.closePath();
  X.fillStyle=flashing?col+'aa':'#fffaf4';
  X.shadowColor=flashing?col:'rgba(168,213,162,0.4)';X.shadowBlur=16;X.fill();
  X.strokeStyle='rgba(107,76,59,0.35)';X.lineWidth=2;X.stroke();X.shadowBlur=0;
  // highlight
  X.fillStyle='rgba(255,255,255,0.45)';X.beginPath();X.ellipse(-r*0.18,-r*0.1,r*0.48,r*0.62,0.12,0,Math.PI*2);X.fill();
  // antlers
  X.strokeStyle='rgba(107,76,59,0.6)';X.lineWidth=2;X.lineCap='round';
  [[[-0.38,-0.82],[-0.52,-1.35]],[[-0.52,-1.35],[-0.72,-1.62]],[[-0.52,-1.35],[-0.32,-1.6]],
   [[0.38,-0.82],[0.52,-1.35]],[[0.52,-1.35],[0.72,-1.62]],[[0.52,-1.35],[0.32,-1.6]]].forEach(function(pts){
    X.beginPath();X.moveTo(pts[0][0]*r,pts[0][1]*r);X.lineTo(pts[1][0]*r,pts[1][1]*r);X.stroke();
  });
  // eyes
  X.fillStyle='rgba(74,55,40,0.85)';
  X.beginPath();X.arc(-r*0.3,-r*0.12,r*0.17,0,Math.PI*2);X.fill();
  X.beginPath();X.arc(r*0.3,-r*0.12,r*0.17,0,Math.PI*2);X.fill();
  X.fillStyle='rgba(255,255,255,0.9)';
  X.beginPath();X.arc(-r*0.24,-r*0.18,r*0.06,0,Math.PI*2);X.fill();
  X.beginPath();X.arc(r*0.36,-r*0.18,r*0.06,0,Math.PI*2);X.fill();
  // mouth
  X.strokeStyle='rgba(74,55,40,0.7)';X.lineWidth=1.5;X.lineCap='round';X.lineJoin='round';
  X.beginPath();X.moveTo(-r*0.14,r*0.14);X.quadraticCurveTo(-r*0.05,r*0.24,0,r*0.16);X.quadraticCurveTo(r*0.05,r*0.24,r*0.14,r*0.14);X.stroke();
  X.restore();
}

function drawEnemy(e,cx,cy){
  var ec=e.frz>0?'#b0c8f0':(e.fl>0?'#fffaf4':e.bodyCol||e.col);
  var flashing=e.invuln>0&&Math.floor(frame/3)%2===0;
  X.save();X.translate(cx,cy);
  X.fillStyle=flashing?e.col+'88':ec;
  X.shadowColor=e.col+'66';X.shadowBlur=10;
  if(e.type==='boss'){
    X.beginPath();for(var k=0;k<10;k++){var a=k/10*Math.PI*2;var rr2=e.r*(1+Math.sin(frame*0.07+k)*0.1);X.lineTo(Math.cos(a)*rr2,Math.sin(a)*rr2);}X.closePath();X.fill();
    X.strokeStyle=e.col+'88';X.lineWidth=2.5;X.stroke();
  } else {
    X.beginPath();X.arc(0,0,e.r,0,Math.PI*2);X.fill();
    X.strokeStyle=e.col+'66';X.lineWidth=2;X.stroke();
  }
  X.shadowBlur=0;
  // cute eyes
  X.fillStyle='rgba(74,55,40,0.7)';
  X.beginPath();X.arc(-e.r*0.28,-e.r*0.12,e.r*0.2,0,Math.PI*2);X.fill();
  X.beginPath();X.arc(e.r*0.28,-e.r*0.12,e.r*0.2,0,Math.PI*2);X.fill();
  X.fillStyle='rgba(255,255,255,0.8)';
  X.beginPath();X.arc(-e.r*0.22,-e.r*0.18,e.r*0.07,0,Math.PI*2);X.fill();
  X.beginPath();X.arc(e.r*0.34,-e.r*0.18,e.r*0.07,0,Math.PI*2);X.fill();
  // stun / frz indicator
  if(e.stun>0||e.frz>0){X.strokeStyle=e.stun>0?'#d8b830':'#78b0e0';X.lineWidth=2;X.globalAlpha=0.6;X.setLineDash([3,3]);X.beginPath();X.arc(0,0,e.r+8,0,Math.PI*2);X.stroke();X.setLineDash([]);X.globalAlpha=1;}
  X.restore();
}

function draw(){
  X.clearRect(0,0,W,H);
  if(stage<3)return;
  var arena=curA||{floor:'#e8f0c0',wall:'#a8c060',col:'#a0c038'};
  var cX=Math.floor(MAP.cx),cY=Math.floor(MAP.cy);

  // pastel floor
  X.fillStyle=arena.floor;X.fillRect(0,0,W,H);
  // soft grid
  X.strokeStyle='rgba(107,76,59,0.07)';X.lineWidth=1;
  var gs=100,gsx=-(cX%gs),gsy=-(cY%gs);
  for(var gx=gsx;gx<W;gx+=gs){X.beginPath();X.moveTo(gx,0);X.lineTo(gx,H);X.stroke();}
  for(var gy=gsy;gy<H;gy+=gs){X.beginPath();X.moveTo(0,gy);X.lineTo(W,gy);X.stroke();}
  // walls (soft, rounded look)
  WALLS.forEach(function(w){
    var wx=w.x-cX,wy=w.y-cY;
    if(wx>W+10||wy>H+10||wx+w.w<-10||wy+w.h<-10)return;
    X.fillStyle=arena.wall;
    X.shadowColor='rgba(107,76,59,0.15)';X.shadowBlur=8;
    rrect(wx,wy,w.w,w.h,8);X.fill();X.shadowBlur=0;
    X.strokeStyle='rgba(255,255,255,0.25)';X.lineWidth=1.5;X.stroke();
  });
  // consecration
  if(P.consecZone){X.save();X.strokeStyle=P.classCol;X.lineWidth=2.5;X.globalAlpha=0.18+Math.sin(frame*0.07)*0.07;X.beginPath();X.arc(P.consecZone.x-cX,P.consecZone.y-cY,P.consecZone.r,0,Math.PI*2);X.stroke();X.fillStyle=P.classCol+'08';X.fill();X.globalAlpha=1;X.restore();}
  // traps
  TRAPS.forEach(function(trap){
    var tx=trap.x-cX,ty=trap.y-cY;if(tx<-60||tx>W+60||ty<-60||ty>H+60)return;
    var ta=trap.type==='saw'||(trap.tmr%80<40);
    X.save();X.translate(tx,ty);
    if(trap.type==='saw'){
      X.rotate(trap.ang);X.strokeStyle='rgba(107,76,59,0.4)';X.lineWidth=2;X.beginPath();X.arc(0,0,trap.r,0,Math.PI*2);X.stroke();
      for(var k=0;k<10;k++){var a=k/10*Math.PI*2;X.beginPath();X.moveTo(Math.cos(a)*trap.r*0.5,Math.sin(a)*trap.r*0.5);X.lineTo(Math.cos(a)*trap.r,Math.sin(a)*trap.r);X.stroke();}
      X.fillStyle='rgba(107,76,59,0.15)';X.beginPath();X.arc(0,0,trap.r*0.3,0,Math.PI*2);X.fill();
    } else {
      if(ta){X.shadowColor='#e87850';X.shadowBlur=14;}
      X.fillStyle=ta?'rgba(232,120,80,0.7)':'rgba(200,160,140,0.4)';
      X.beginPath();X.arc(0,0,trap.r*0.48,0,Math.PI*2);X.fill();
      X.strokeStyle=ta?'#d8b830':'rgba(200,160,140,0.3)';X.lineWidth=2;X.beginPath();X.arc(0,0,trap.r,0,Math.PI*2);X.stroke();X.shadowBlur=0;
    }
    X.restore();
  });
  // scraps
  SCRAPS.forEach(function(sc){var sx=sc.x-cX,sy=sc.y-cY;if(sx<-20||sx>W+20||sy<-20||sy>H+20)return;X.fillStyle='#b0a898';X.strokeStyle='rgba(255,255,255,0.5)';X.lineWidth=1;X.beginPath();X.arc(sx,sy,7,0,Math.PI*2);X.fill();X.stroke();});
  // spell fx
  SPW.forEach(function(sv){
    if(sv.type==='ltng'){X.save();X.strokeStyle='#d8c028';X.lineWidth=3;X.globalAlpha=sv.l/16;X.shadowColor='#d8c028';X.shadowBlur=8;X.beginPath();X.moveTo(sv.x1-cX,sv.y1-cY);X.lineTo(sv.x2-cX,sv.y2-cY);X.stroke();X.globalAlpha=1;X.restore();}
    if(sv.type==='clash'){X.save();X.globalAlpha=sv.l/18*0.8;X.fillStyle='#f5d98c';X.shadowColor='#d8b830';X.shadowBlur=12;X.beginPath();X.arc(sv.x-cX,sv.y-cY,sv.l*1.2,0,Math.PI*2);X.fill();X.globalAlpha=1;X.restore();}
    if(sv.type==='parry'){X.save();X.globalAlpha=sv.l/20;X.strokeStyle='#fffaf4';X.lineWidth=2.5;for(var k=0;k<8;k++){var a=k/8*Math.PI*2;X.beginPath();X.moveTo(sv.x-cX,sv.y-cY);X.lineTo(sv.x-cX+Math.cos(a)*sv.l*18,sv.y-cY+Math.sin(a)*sv.l*18);X.stroke();}X.globalAlpha=1;X.restore();}
  });
  // items
  ITW.forEach(function(it){
    var ix=it.x-cX,iy=it.y-cY;if(ix<-30||ix>W+30||iy<-30||iy>H+30)return;
    var ps=1+Math.sin(it.pulse)*0.14;
    X.save();X.translate(ix,iy);X.scale(ps,ps);
    X.shadowColor=it.t.col+'88';X.shadowBlur=10;
    if(it.special){X.strokeStyle=it.t.col;X.lineWidth=2.5;X.globalAlpha=0.5+Math.sin(it.pulse*2)*0.3;X.beginPath();X.arc(0,0,it.r*1.6,0,Math.PI*2);X.stroke();X.globalAlpha=1;}
    // soft pill background
    X.fillStyle='rgba(253,248,240,0.7)';X.beginPath();X.arc(0,0,it.r,0,Math.PI*2);X.fill();
    X.strokeStyle=it.t.col+'aa';X.lineWidth=2;X.beginPath();X.arc(0,0,it.r,0,Math.PI*2);X.stroke();
    X.shadowBlur=0;X.font=Math.round(it.r*1.05)+'px serif';X.textAlign='center';X.textBaseline='middle';X.fillText(it.t.e,0,2);
    X.restore();
  });
  // projectiles
  PROJ.forEach(function(proj){
    var prx=proj.x-cX,pry=proj.y-cY;if(prx<-20||prx>W+20||pry<-20||pry>H+20)return;
    if(proj.trail){proj.trail.forEach(function(tr){X.globalAlpha=tr.l/13*0.32;X.fillStyle=proj.col;X.beginPath();X.arc(tr.x-cX,tr.y-cY,proj.r*0.5,0,Math.PI*2);X.fill();});}
    X.globalAlpha=1;X.save();X.translate(prx,pry);
    X.fillStyle=proj.col;X.shadowColor=proj.col+'66';X.shadowBlur=8;
    if(proj.type==='shuriken'){X.rotate(proj.spin||0);for(var k=0;k<4;k++){var a=k/4*Math.PI*2;X.beginPath();X.moveTo(0,0);X.lineTo(Math.cos(a)*proj.r,Math.sin(a)*proj.r);X.strokeStyle=proj.col;X.lineWidth=2.5;X.stroke();}}
    else if(proj.type==='arrow'){X.save();X.rotate(Math.atan2(proj.vy,proj.vx));X.fillRect(-10,-3,20,6);X.restore();}
    else{X.beginPath();X.arc(0,0,proj.r,0,Math.PI*2);X.fill();}
    X.shadowBlur=0;X.restore();
  });
  X.globalAlpha=1;
  // particles
  PARTS.forEach(function(pp){var px=pp.x-cX,py=pp.y-cY;if(px<-10||px>W+10||py<-10||py>H+10)return;X.globalAlpha=pp.l/38;X.fillStyle=pp.c;X.beginPath();X.arc(px,py,pp.r,0,Math.PI*2);X.fill();});X.globalAlpha=1;

  // enemies
  ENE.forEach(function(e){
    var ex=e.x-cX,ey=e.y-cY;if(ex<-70||ex>W+70||ey<-70||ey>H+70)return;
    drawEnemy(e,ex,ey);
    // enemy diamond weapon (S1 shape)
    if(e.disarmed<=0){
      var df=e.sw.dur/e.sw.mdur;
      var weapCol=df>0.5?e.col:df>0.25?'#d8b830':'#d85858';
      var eTpX=ex+Math.cos(e.sw.a)*e.sw.rad,eTpY=ey+Math.sin(e.sw.a)*e.sw.rad;
      drawDiamond(eTpX,eTpY,e.sw.sz,weapCol,'rgba(255,255,255,0.3)',e.sw.a,e.col+'44');
    }
    // hp bar (soft pill style)
    var hf=e.hp/e.mhp;
    X.fillStyle='rgba(107,76,59,0.15)';rrect(ex-e.r,ey-e.r-13,e.r*2,7,3.5);X.fill();
    X.fillStyle=hf>0.5?'#a8d5a2':hf>0.25?'#f5d98c':'#f0a8b8';rrect(ex-e.r,ey-e.r-13,e.r*2*hf,7,3.5);X.fill();
  });

  // player
  var px=P.x-cX,py=P.y-cY,dashing=P.dashActive>0;
  // shield ring
  if(P.shield&&P.shieldT>0){X.strokeStyle='#78b0e0';X.lineWidth=3;X.globalAlpha=0.5+Math.sin(frame*0.2)*0.3;X.shadowColor='#78b0e0';X.shadowBlur=14;X.beginPath();X.arc(px,py,P.r+16,0,Math.PI*2);X.stroke();X.shadowBlur=0;X.globalAlpha=1;}
  if(P.capricornShield>0){X.strokeStyle='#a8a8c0';X.lineWidth=3;X.globalAlpha=0.7;X.setLineDash([4,4]);X.beginPath();X.arc(px,py,P.r+20,0,Math.PI*2);X.stroke();X.setLineDash([]);X.globalAlpha=1;}
  if(P.vampireMode>0){X.fillStyle='rgba(168,213,162,0.15)';X.beginPath();X.arc(px,py,P.r+12,0,Math.PI*2);X.fill();}
  if(dashing)addP(P.x,P.y,P.classCol,2,1.5);
  drawPlayer(px,py);
  // player weapon (diamond, S1 shape)
  var pTpX=px+Math.cos(P.sw.a)*P.sw.rad,pTpY=py+Math.sin(P.sw.a)*P.sw.rad;
  var df2=P.sw.dur/P.sw.mdur;
  var pwCol=P.sw.glass?'#a0d0f0':(df2>0.6?P.classCol:df2>0.3?'#d8b830':'#d85858');
  var pwStroke=P.sw.glass?'rgba(160,208,240,0.5)':'rgba(255,255,255,0.4)';
  // orbit ring (subtle)
  X.strokeStyle=P.classCol+'28';X.lineWidth=1;X.setLineDash([4,6]);X.beginPath();X.arc(px,py,P.sw.rad,0,Math.PI*2);X.stroke();X.setLineDash([]);
  // glow trail
  X.strokeStyle=pwCol+'33';X.lineWidth=14;X.lineCap='round';
  X.beginPath();X.arc(px,py,P.sw.rad,P.sw.a-0.3,P.sw.a+0.05);X.stroke();
  drawDiamond(pTpX,pTpY,P.sw.sz,pwCol,pwStroke,P.sw.a,P.sw.glass?'#a0d0f0':pwCol+'66');

  // mega blade
  if(P.megaBladeTimer>0){var mba=P.megaBladeAngle;X.strokeStyle='#d8b830';X.lineWidth=10;X.lineCap='round';X.shadowColor='#d8b830';X.shadowBlur=20;X.globalAlpha=0.9;X.beginPath();X.moveTo(px-Math.cos(mba)*80*0.3,py-Math.sin(mba)*80*0.3);X.lineTo(px+Math.cos(mba)*80,py+Math.sin(mba)*80);X.stroke();X.shadowBlur=0;X.globalAlpha=1;}
  // desktop cursor
  if(!isMob){X.fillStyle='rgba(107,76,59,0.45)';X.beginPath();X.arc(mouse.x||W/2,mouse.y||H/2,5,0,Math.PI*2);X.fill();X.strokeStyle='rgba(107,76,59,0.2)';X.lineWidth=1;X.beginPath();X.arc(mouse.x||W/2,mouse.y||H/2,10,0,Math.PI*2);X.stroke();}
  var mouse={x:0,y:0};
  C.onmousemove=function(ev){mouse.x=ev.clientX;mouse.y=ev.clientY;if(P&&stage===3)aimAng=Math.atan2(ev.clientY+MAP.cy-P.y,ev.clientX+MAP.cx-P.x);};

  // weather overlay (soft)
  drawWeather();

  // minimap
  var mm={x:W-88,y:10,w:78,h:52};
  X.fillStyle='rgba(253,248,240,0.7)';rrect(mm.x,mm.y,mm.w,mm.h,8);X.fill();
  X.strokeStyle='rgba(107,76,59,0.12)';X.lineWidth=1.5;rrect(mm.x,mm.y,mm.w,mm.h,8);X.stroke();
  var mpx=mm.x+(P.x/MAP.w)*mm.w,mpy=mm.y+(P.y/MAP.h)*mm.h;
  X.fillStyle=P.classCol;X.beginPath();X.arc(mpx,mpy,4,0,Math.PI*2);X.fill();
  ENE.forEach(function(e){var emx=mm.x+(e.x/MAP.w)*mm.w,emy=mm.y+(e.y/MAP.h)*mm.h;X.fillStyle=e.col+'88';X.fillRect(emx-1.5,emy-1.5,3,3);});
}

function drawWeather(){
  if(!curW)return;
  var id=curW.id;
  if(id==='fog'){X.fillStyle='rgba(232,224,212,0.12)';X.fillRect(0,0,W,H);}
  if(id==='rain'&&frame%3===0){for(var i=0;i<12;i++){X.strokeStyle='rgba(120,176,224,0.18)';X.lineWidth=1;X.beginPath();var rx=Math.random()*W,ry=Math.random()*H;X.moveTo(rx,ry);X.lineTo(rx-2,ry+14);X.stroke();}}
  if(id==='snow'&&frame%4===0){for(var i=0;i<8;i++){X.fillStyle='rgba(255,255,255,0.55)';X.beginPath();X.arc(Math.random()*W,Math.random()*H,2,0,Math.PI*2);X.fill();}}
  if(id==='aurora'){var gr=X.createLinearGradient(0,0,W,H);gr.addColorStop(0,'rgba(196,174,232,0.06)');gr.addColorStop(1,'rgba(168,213,162,0.06)');X.fillStyle=gr;X.fillRect(0,0,W,H);}
  if(id==='eclipse'){X.fillStyle='rgba(140,100,80,0.14)';X.fillRect(0,0,W,H);}
}

// ─── LOOP ──────────────────────────────
function loop(){update();draw();requestAnimationFrame(loop);}
resize();buildSel();loop();
</script>
</body>
