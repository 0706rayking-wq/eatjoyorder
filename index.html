function addP(x,y,c,n,sp){n=n||6;sp=sp||2;for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,v=sp*(0.4+Math.random());PARTS.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,c:c,l:22+Math.random()*16,r:2+Math.random()*2.5});}}
function roundRect(x,y,w,h,r){X.beginPath();X.moveTo(x+r,y);X.lineTo(x+w-r,y);X.arcTo(x+w,y,x+w,y+r,r);X.lineTo(x+w,y+h-r);X.arcTo(x+w,y+h,x+w-r,y+h,r);X.lineTo(x+r,y+h);X.arcTo(x,y+h,x,y+h-r,r);X.lineTo(x,y+r);X.arcTo(x,y,x+r,y,r);X.closePath();}

function tipOf(ox,oy,sw2){
  var t=sw2.orbitType||'circle',a=sw2.a,r=sw2.rad;
  if(t==='ellipse')return{x:ox+Math.cos(a)*r,y:oy+Math.sin(a)*(r*0.42)};
  if(t==='inf'){var s2=Math.sin(a),d2=1+s2*s2;return{x:ox+Math.cos(a)*r/d2,y:oy+Math.sin(a)*Math.cos(a)*r/d2};}
  if(t==='square'){var nr=r/Math.max(Math.abs(Math.cos(a)),Math.abs(Math.sin(a)));return{x:ox+Math.cos(a)*nr,y:oy+Math.sin(a)*nr};}
  return{x:ox+Math.cos(a)*r,y:oy+Math.sin(a)*r};
}

function getBtns(){
  var bw=sc(isMobile?48:44),bh=sc(isMobile?36:30);

    sp1:{x:rx-bw*3-sc(10),y:bot-bh*2-sc(6),w:bw,h:bh,col:'#a29bfe'},
    sp2:{x:rx-bw*2-sc(5),y:bot-bh*2-sc(6),w:bw,h:bh,col:'#a29bfe'},
    skA:{x:rx-bw*4-sc(15),y:bot-bh,w:bw,h:bh,col:''},
    skB:{x:rx-bw*3-sc(10),y:bot-bh,w:bw,h:bh,col:''},
    shr:{x:rx-bw*2-sc(5),y:bot-bh,w:bw,h:bh,col:'#00b894'},
    dsh:{x:rx-bw,y:bot-bh,w:bw,h:bh,col:'#6c5ce7'},
  };
}

function checkWallCollision(nx,ny,r){for(var i=0;i<WALLS.length;i++){var w=WALLS[i];if(nx>w.x-r&&nx<w.x+w.w+r&&ny>w.y-r&&ny<w.y+w.h+r)return true;}return false;}
function getCanvasXY(t){var r=C.getBoundingClientRect();return{x:t.clientX-r.left,y:t.clientY-r.top};}
function getMoveDir(){
  if(isMobile){if(joy.on&&(joy.dx||joy.dy))return{x:joy.dx,y:joy.dy};return{x:0,y:0};}
  var mx=0,my=0;
  if(keys['ArrowLeft']||keys['a']||keys['A'])mx-=1;if(keys['ArrowRight']||keys['d']||keys['D'])mx+=1;
  if(keys['ArrowUp']||keys['w']||keys['W'])my-=1;if(keys['ArrowDown']||keys['s']||keys['S'])my+=1;
  if(mx||my){var m=Math.sqrt(mx*mx+my*my);return{x:mx/m,y:my/m};}return{x:0,y:0};
}

function handleSelClick(x,y){
  var list=selStage===0?CLASSES:(selStage===1?ZODIACS:CHINESE);
  var cols=4,bw=sc(144),bh=selStage===0?sc(82):sc(74),gap=sc(5);
  var rows=Math.ceil(list.length/cols),totalH=rows*bh+(rows-1)*gap;
  var totalW=cols*bw+(cols-1)*gap,sx=(W-totalW)/2,sy=(H-totalH)/2+sc(18);
  for(var i=0;i<list.length;i++){var col=i%cols,row=Math.floor(i/cols),bx=sx+col*(bw+gap),by=sy+row*(bh+gap);if(x>=bx&&x<=bx+bw&&y>=by&&y<=by+bh){if(selStage===0){selClass=list[i];selStage=1;}else if(selStage===1){selZodiac=list[i];selStage=2;}else{selChinese=list[i];startGame();}return;}}
}

  X.fillStyle=arena.col+'66';var mpx=mm.x+(P.x/MAP.w)*mm.w,mpy=mm.y+(P.y/MAP.h)*mm.h;X.beginPath();X.arc(mpx,mpy,3.5,0,Math.PI*2);X.fill();

    X.fillStyle='rgba(255,255,255,0.4)';X.font=sc(11)+'px Nunito,sans-serif';X.fillText(isMobile?'點擊重新選擇角色':'按 R 重新選擇角色',W/2,H/2+sc(34));
  }
